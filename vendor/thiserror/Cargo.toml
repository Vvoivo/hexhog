[dependencies.thiserror-impl]
version = "=2.0.16"

[dev-dependencies.anyhow]
version = "1.0.73"

[dev-dependencies.ref-cast]
version = "1.0.18"

[dev-dependencies.rustversion]
version = "1.0.13"

[dev-dependencies.trybuild]
features = ["diff"]
version = "1.0.81"

[features]
default = ["std"]
std = []

[lib]
path = "src/lib.rs"

[package]
authors = ["David Tolnay <dtolnay@gmail.com>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["rust-patterns", "no-std"]
description = "derive(Error)"
documentation = "https://docs.rs/thiserror"
edition = "2021"
keywords = ["error", "error-handling", "derive"]
license = "MIT OR Apache-2.0"
name = "thiserror"
readme = "README.md"
repository = "https://github.com/dtolnay/thiserror"
rust-version = "1.61"
version = "2.0.16"

[package.metadata.docs.rs]
rustdoc-args = ["--generate-link-to-definition", "--extern-html-root-url=core=https://doc.rust-lang.org", "--extern-html-root-url=alloc=https://doc.rust-lang.org", "--extern-html-root-url=std=https://doc.rust-lang.org"]
targets = ["x86_64-unknown-linux-gnu"]
